server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace these placeholders in a private server deployment.
    server_name <update-host> _;
    root <remote-update-root>;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/lucimatools-update.access.log;
    error_log /var/log/nginx/lucimatools-update.error.log;

    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location = /stable.json {
        default_type application/json;
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
